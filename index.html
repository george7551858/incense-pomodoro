<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>一炷香 · 蕃茄鐘</title>
<meta name="description" content="以一炷香為意象的極簡專注計時器:點香、看煙起、香盡而功成。" />

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#efe7d6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#101117" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="icons/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="一炷香" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage"></div>

  <!-- sunlit style: sunlight filtering through blinds and tree shadows in dappled patches (changes with day/night) -->
  <div id="sunlight">
    <div class="glow"></div>
    <div class="glow-bounce"></div>
    <svg width="0" height="0" style="position:absolute;" aria-hidden="true">
      <defs>
        <filter id="wind" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" numOctaves="2" seed="1">
            <animate attributeName="baseFrequency" dur="16s" keyTimes="0;0.33;0.66;1"
              values="0.005 0.003;0.01 0.009;0.008 0.004;0.005 0.003" repeatCount="indefinite" />
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic">
            <animate attributeName="scale" dur="20s" keyTimes="0;0.25;0.5;0.75;1"
              values="45;55;75;55;45" repeatCount="indefinite" />
          </feDisplacementMap>
        </filter>
      </defs>
    </svg>
    <div class="shade">
      <div class="wind">
        <div class="perspective">
          <div class="leaves"></div>
        </div>
      </div>
      <div class="perspective">
        <div class="blinds">
          <div class="shutters">
            <div class="shutter"></div><div class="shutter"></div><div class="shutter"></div>
            <div class="shutter"></div><div class="shutter"></div><div class="shutter"></div>
            <div class="shutter"></div><div class="shutter"></div><div class="shutter"></div>
            <div class="shutter"></div><div class="shutter"></div><div class="shutter"></div>
            <div class="shutter"></div><div class="shutter"></div><div class="shutter"></div>
            <div class="shutter"></div><div class="shutter"></div><div class="shutter"></div>
            <div class="shutter"></div><div class="shutter"></div><div class="shutter"></div>
            <div class="shutter"></div><div class="shutter"></div>
          </div>
          <div class="vertical">
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="progressive-blur">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>

  <canvas id="scene"></canvas>
  <div id="grain"></div>
  <div id="vignette"></div>

  <div id="readout">
    <div id="time">25:00</div>
    <div id="phase"></div>
  </div>

  <div id="done">
    <div class="big">香 盡</div>
    <div class="sub">一 念 圓 滿</div>
  </div>

  <button id="timeToggle" title="蕃茄鐘 · 顯示時間" aria-label="顯示時間" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 7.4c4.1 0 6.7 2.7 6.7 6.3S15.8 20.4 12 20.4s-6.7-3.1-6.7-6.7S7.9 7.4 12 7.4Z" stroke="currentColor" stroke-width="1.3"/>
      <path d="M12 7.4V4.7M12 7.4c.2-1.6 1.5-2.7 3.3-2.6M12 7.4c-.2-1.4-1.4-2.4-3-2.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="adjgrp" id="adjRest" hidden>
    <button class="btn step" data-act="rest-" title="休息 −1 分" aria-label="休息 減 1 分">−</button>
    <button class="btn step" data-act="rest+" title="休息 +1 分" aria-label="休息 加 1 分">+</button>
  </div>

  <div id="tally">
    <span>今日</span>
    <span class="dots" id="dots"></span>
  </div>

  <button id="themeToggle" title="夜 / 晝" aria-label="切換主題">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none"></svg>
  </button>

  <div id="hint">輕觸畫面 · 點香</div>

  <div id="controls">
    <div class="presets" id="presets"></div>
    <div class="actions">
      <button class="btn" id="reset" disabled title="重燃" aria-label="重燃">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 12a8 8 0 0 1 13.4-5.9M20 12a8 8 0 0 1-13.4 5.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M20 4v5h-5M4 20v-5h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="ignite" title="點香 / 暫停" aria-label="點香">
        <svg viewBox="0 0 24 24" fill="none" id="igniteIcon">
          <path d="M12 3c1.8 2.4 4.2 4 4.2 7.2A4.2 4.2 0 0 1 12 14.4a4.2 4.2 0 0 1-4.2-4.2C7.8 7 10.2 5.4 12 3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M12 14.4V21" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="adjgrp" id="adjWork" hidden>
        <button class="btn step" data-act="work-" title="香 −1 分" aria-label="香 減 1 分">−</button>
        <button class="btn step" data-act="work+" title="延香 +1 分" aria-label="香 加 1 分">+</button>
      </div>
    </div>
  </div>

<script src="js/scene.js"></script>
<script src="js/app.js"></script>
</body>
</html>
